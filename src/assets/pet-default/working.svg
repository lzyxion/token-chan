<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 96" width="104" height="96">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eefcf8"/><stop offset="100%" stop-color="#a5e6da"/>
    </linearGradient>
    <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#83e3f7"/><stop offset="100%" stop-color="#1f9dc4"/>
    </linearGradient>
    <clipPath id="body">
      <path d="M6 82C6 44 24 16 52 16C80 16 98 44 98 82C98 88 88 93 52 93C16 93 6 88 6 82Z"/>
    </clipPath>
    <!-- 애니메이션은 파일 안에 있어야 <img> 로 그려도 돈다 (바깥 CSS 는 닿지 않음) -->
    <style>
      .bub { fill:#fff; opacity:0; animation: rise 1.8s ease-in infinite; }
      .b2 { animation-duration: 2.2s; animation-delay: .55s; }
      .b3 { animation-duration: 1.95s; animation-delay: 1.05s; }
      @keyframes rise {
        0%   { opacity:0; transform: translateY(0); }
        18%  { opacity:.8; }
        72%  { opacity:.8; }
        100% { opacity:0; transform: translateY(-34px); }
      }
    </style>
  </defs>

  <path d="M6 82C6 44 24 16 52 16C80 16 98 44 98 82C98 88 88 93 52 93C16 93 6 88 6 82Z"
        fill="url(#shell)" fill-opacity=".92" stroke="#2b8578" stroke-width="2.4"/>

  <g clip-path="url(#body)">
    <ellipse cx="52" cy="51" rx="58" ry="4.5" fill="#83e3f7"/>
    <rect x="-6" y="51" width="116" height="56" fill="url(#liq)"/>
    <circle class="bub" cx="37" cy="86" r="3.4"/>
    <circle class="bub b2" cx="54" cy="89" r="2.3"/>
    <circle class="bub b3" cx="68" cy="84" r="2.9"/>
    <ellipse cx="52" cy="93" rx="46" ry="16" fill="#14655a" opacity=".28"/>
  </g>

  <ellipse cx="33" cy="37" rx="13" ry="8.5" fill="#fff" opacity=".5" transform="rotate(-24 33 37)"/>
  <circle cx="47" cy="27" r="3.4" fill="#fff" opacity=".75"/>

  <ellipse cx="24" cy="65" rx="7.5" ry="4.2" fill="#ff92a8" opacity=".55"/>
  <ellipse cx="80" cy="65" rx="7.5" ry="4.2" fill="#ff92a8" opacity=".55"/>

  <!-- 집중한 실눈 -->
  <ellipse cx="37" cy="55" rx="6.4" ry="4.8" fill="#1f544c"/>
  <circle cx="34.6" cy="53" r="1.8" fill="#fff" opacity=".95"/>
  <ellipse cx="67" cy="55" rx="6.4" ry="4.8" fill="#1f544c"/>
  <circle cx="64.6" cy="53" r="1.8" fill="#fff" opacity=".95"/>

  <path d="M44 70q4 5.5 8 0q4 5.5 8 0" fill="none" stroke="#1f544c" stroke-width="2.4" stroke-linecap="round"/>
</svg>
