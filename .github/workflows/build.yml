name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # 워크스페이스 전체 테스트. ubuntu 는 차감 1배라 여기서 돌리는 게 가장 싸다
  # (windows 2배, macOS 10배). 실측: 이 잡 25초 vs 번들 잡들 합쳐 ~46분 차감.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      # `--workspace` 는 src-tauri 크레이트까지 컴파일하므로 리눅스에서는 Tauri 시스템
      # 의존성이 필요하다. 목록은 README 개발 안내와 같다.
      - name: Tauri 시스템 의존성
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      # `-p usage-core` 였을 때는 src-tauri 테스트가 어디서도 안 돌았다.
      # 덤으로 token-chan 크레이트의 리눅스 컴파일도 여기서만 검증된다
      # (번들 매트릭스는 windows/macOS 뿐) — cfg 분기 실수를 잡아 준다.
      - run: cargo test --workspace

  # 번들은 **릴리스용**이다. 매 푸시마다 돌리면 차감의 98% 를 여기서 쓴다
  # (실측 1회: windows 6분×2배 + macOS 3분×10배 ≈ 46분).
  # 그래서 `v*` 태그를 밀거나 수동 실행할 때만 돈다.
  bundle:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # 릴리스 생성(태그 빌드)에 쓰기 권한이 필요하다 — 기본 토큰은 저장소 설정에 따라 읽기 전용
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: pnpm install
      # 태그 빌드면 GitHub Release(초안)까지 만들어 번들을 첨부한다. 초안인 이유:
      # 두 OS 잡이 따로 도는데 완성 전에 공개되면 자산이 반쪽인 릴리스가 노출된다 —
      # 둘 다 끝난 걸 확인하고 사람이 publish 버튼을 누른다.
      # workflow_dispatch(태그 없음)면 tagName 이 빈 문자열이라 릴리스 없이 빌드만 한다.
      - name: Build Tauri bundle (msi/dmg)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "TokenChan __VERSION__"
          releaseDraft: true
          releaseBody: |
            ⚠️ 바이너리는 코드 서명이 없습니다 — 개인 프로젝트라 서명 인증서를 쓰지 않습니다.
            - **Windows**: SmartScreen 경고가 뜨면 "추가 정보" → "실행"
            - **macOS**: 첫 실행 시 우클릭 → "열기" (또는 `xattr -cr /Applications/TokenChan.app`)
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
          if-no-files-found: warn
